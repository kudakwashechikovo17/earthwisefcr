services:
  - type: web
    name: earthwise-fcr-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn prediction:app --host 0.0.0.0 --port $PORT
    rootDir: summative/API
    envVars:
      - key: ALLOWED_ORIGINS
        value: "http://localhost,http://localhost:3000,http://127.0.0.1,http://10.0.2.2"
      - key: PYTHON_VERSION
        value: "3.11.0"
